<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panitia — Akpol Golf Charity 2026</title>
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#072A5C; --red:#C80205; --gold:#FAB312; --body:#272525;
  --white:#fff; --mist:#f2f2f2; --cloud:#ddd; --muted:rgba(39,37,37,.64);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--body);
  font:400 16px/1.5 'Inter',ui-sans-serif,system-ui,sans-serif;letter-spacing:-.16px;
  font-feature-settings:"ss01" on,"cv11" on;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--navy);font-weight:600;letter-spacing:-.02em}
a{color:var(--red)}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px}
@media (max-width:520px){.wrap{padding-inline:16px}}
header{border-bottom:1px solid var(--mist);padding-block:20px;position:sticky;top:0;background:var(--white);z-index:10}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar img{height:38px;width:auto}
.bar h1{font-size:20px;line-height:1.3}
.bar .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14px/1.5 'Inter',sans-serif;
  padding:9px 14px;border-radius:4px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn--filled{background:var(--navy);color:#fff}
.btn--filled:hover{background:#04193a}
.btn--line{background:#fff;border-color:var(--cloud);color:var(--body)}
.btn--line:hover{background:var(--mist)}
.btn--sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
input,select{font:400 15px/1.5 'Inter',sans-serif;color:var(--body);background:#fff;
  border:1px solid var(--cloud);border-radius:4px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--navy);border-color:var(--navy)}
main{padding-block:32px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--mist);border-radius:16px;padding:20px}
.tile__n{font-size:28px;font-weight:600;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.tile__l{font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.65px}
.panel{border:1px solid var(--mist);border-radius:16px;padding:20px;margin-bottom:24px}
.panel h2{font-size:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:500;padding:4px 10px;border-radius:4px;background:var(--mist);color:var(--muted)}
.chip b{color:var(--navy)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input,.tools select{width:auto;min-width:200px}
.tabel-bungkus{overflow-x:auto;border:1px solid var(--mist);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--mist);vertical-align:top}
th{font-size:12px;letter-spacing:.65px;color:var(--muted);font-weight:500;text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .kode{font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
td .sub{font-size:12.5px;color:var(--muted)}
.st{font-size:12px;font-weight:500;padding:3px 9px;border-radius:4px;white-space:nowrap}
.st--menunggu{background:var(--mist);color:var(--muted)}
.st--terverifikasi{background:rgba(250,179,18,.18);color:var(--navy)}
.st--batal{background:rgba(200,2,5,.1);color:var(--red)}
.aksi{display:flex;gap:6px;flex-wrap:wrap}
.kosong{padding:32px;text-align:center;color:var(--muted)}
.gerbang{max-width:420px;margin:80px auto;border:1px solid var(--mist);border-radius:24px;padding:32px}
.gerbang p{color:var(--muted);font-size:14.5px;margin:8px 0 20px}
.pesan{font-size:13.5px;margin-top:12px;min-height:20px}
.pesan--err{color:var(--red)}
.pesan--ok{color:var(--navy)}
</style>
</head>
<body>

<div id="gerbang" class="gerbang">
  <h1>Halaman panitia</h1>
  <p>Masukkan token panitia untuk melihat dan memverifikasi pendaftaran. Token diatur lewat environment variable <code>ADMIN_TOKEN</code> di server.</p>
  <form id="formToken">
    <label for="token" style="font-size:14px;font-weight:500">Token panitia</label>
    <input id="token" type="password" autocomplete="current-password" style="margin-top:6px" required>
    <button class="btn btn--filled" type="submit" style="margin-top:16px">Masuk</button>
    <div class="pesan pesan--err" id="pesanToken"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap bar">
      <img src="logo-mark.png" alt="">
      <h1>Panitia — Akpol Golf Charity 2026</h1>
      <div class="sp"></div>
      <button class="btn btn--line btn--sm" id="muat" type="button">Muat ulang</button>
      <button class="btn btn--line btn--sm" id="ekspor" type="button">Ekspor CSV</button>
      <button class="btn btn--line btn--sm" id="keluar" type="button">Keluar</button>
    </div>
  </header>

  <main class="wrap">
    <div class="tiles" id="tiles"></div>

    <div class="panel">
      <h2>Rekap ukuran jersey</h2>
      <div class="chips" id="jersey"></div>
    </div>

    <div class="tools">
      <input id="cari" type="search" placeholder="Cari nama, kode, WhatsApp, email…">
      <select id="filterStatus">
        <option value="">Semua status</option>
        <option value="menunggu">Menunggu verifikasi</option>
        <option value="terverifikasi">Terverifikasi</option>
        <option value="batal">Batal</option>
      </select>
      <select id="filterKategori">
        <option value="">Semua kategori</option>
        <option value="umum">Peserta umum</option>
        <option value="internal">Peserta internal</option>
        <option value="sponsor">Slot sponsor</option>
      </select>
      <span class="pesan" id="pesan"></span>
    </div>

    <div class="tabel-bungkus">
      <table>
        <thead><tr>
          <th>Kode</th><th>Peserta</th><th>Kontak</th><th>Kategori</th><th>Jersey</th>
          <th>Handicap</th><th>Status</th><th>Check-in</th><th>Aksi</th>
        </tr></thead>
        <tbody id="baris"></tbody>
      </table>
      <div class="kosong" id="kosong" hidden>Belum ada pendaftaran.</div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KUNCI = "agc26_token_panitia";
  var token = "";
  var data = [];

  var LABEL = { umum: "Peserta umum", internal: "Peserta internal", sponsor: "Slot sponsor" };

  function minta(jalur, opsi) {
    opsi = opsi || {};
    opsi.headers = Object.assign({ "authorization": "Bearer " + token }, opsi.headers || {});
    return fetch(jalur, opsi).then(function (r) {
      if (r.status === 401) throw new Error("Token panitia salah.");
      if (r.status === 503) throw new Error("ADMIN_TOKEN belum diatur di server.");
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || "Permintaan gagal.");
        return j;
      });
    });
  }

  function simpanToken(t) { try { sessionStorage.setItem(KUNCI, t); } catch (e) {} }
  function bacaToken() { try { return sessionStorage.getItem(KUNCI) || ""; } catch (e) { return ""; } }

  function masuk(t) {
    token = t;
    return minta("/api/panitia/peserta").then(function (j) {
      simpanToken(t);
      $("gerbang").hidden = true;
      $("app").hidden = false;
      terima(j);
    });
  }

  $("formToken").addEventListener("submit", function (e) {
    e.preventDefault();
    $("pesanToken").textContent = "Memeriksa…";
    masuk($("token").value.trim()).catch(function (err) {
      $("pesanToken").textContent = err.message;
    });
  });

  $("keluar").addEventListener("click", function () {
    try { sessionStorage.removeItem(KUNCI); } catch (e) {}
    location.reload();
  });

  $("muat").addEventListener("click", function () {
    minta("/api/panitia/peserta").then(terima).catch(pesanErr);
  });

  $("ekspor").addEventListener("click", function () {
    fetch("/api/panitia/ekspor.csv", { headers: { authorization: "Bearer " + token } })
      .then(function (r) { return r.blob(); })
      .then(function (b) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "peserta-akpol-golf-2026.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      }).catch(pesanErr);
  });

  function pesanErr(err) {
    var p = $("pesan");
    p.className = "pesan pesan--err";
    p.textContent = err.message || String(err);
  }
  function pesanOk(t) {
    var p = $("pesan");
    p.className = "pesan pesan--ok";
    p.textContent = t;
    setTimeout(function () { if (p.textContent === t) p.textContent = ""; }, 3000);
  }

  function terima(j) {
    data = j.peserta || [];
    var r = j.rekap || {};
    var k = r.kuota || { total: 0, terpakai: 0, sisa: 0 };
    var s = r.status || {};
    $("tiles").innerHTML = [
      tile(k.terpakai + " / " + k.total, "Kuota terpakai"),
      tile(k.sisa, "Sisa kursi"),
      tile(s.menunggu || 0, "Menunggu verifikasi"),
      tile(s.terverifikasi || 0, "Terverifikasi"),
      tile(r.checkin || 0, "Sudah check-in")
    ].join("");
    var jr = r.jersey || {};
    $("jersey").innerHTML = ["S", "M", "L", "XL", "XXL", "XXXL"].map(function (u) {
      return '<span class="chip">' + u + ' <b>' + (jr[u] || 0) + '</b></span>';
    }).join("") || '<span class="chip">Belum ada data</span>';
    gambar();
  }

  function tile(n, l) {
    return '<div class="tile"><div class="tile__n"></div><div class="tile__l"></div></div>'
      .replace('<div class="tile__n"></div>', '<div class="tile__n">' + esc(n) + '</div>')
      .replace('<div class="tile__l"></div>', '<div class="tile__l">' + esc(l) + '</div>');
  }

  function esc(v) {
    return String(v).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function waktu(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function gambar() {
    var q = $("cari").value.trim().toLowerCase();
    var fs = $("filterStatus").value, fk = $("filterKategori").value;
    var list = data.filter(function (p) {
      if (fs && p.status !== fs) return false;
      if (fk && p.kategori !== fk) return false;
      if (!q) return true;
      return [p.kode, p.nama, p.wa, p.email, p.instansi].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    $("kosong").hidden = list.length > 0;
    $("baris").innerHTML = list.map(function (p) {
      return '<tr>' +
        '<td><span class="kode">' + esc(p.kode) + '</span><div class="sub">' + waktu(p.dibuat) + '</div></td>' +
        '<td>' + esc(p.nama) + (p.instansi ? '<div class="sub">' + esc(p.instansi) + '</div>' : '') + '</td>' +
        '<td><a href="https://wa.me/' + esc(p.wa) + '" target="_blank" rel="noopener">+' + esc(p.wa) + '</a>' +
          '<div class="sub">' + esc(p.email) + '</div></td>' +
        '<td>' + esc(LABEL[p.kategori] || p.kategori) + (p.kode_undangan ? '<div class="sub">' + esc(p.kode_undangan) + '</div>' : '') + '</td>' +
        '<td>' + esc(p.jersey) + '</td>' +
        '<td>' + esc(p.handicap || "—") + '</td>' +
        '<td><span class="st st--' + esc(p.status) + '">' + esc(p.status) + '</span>' +
          (p.diverifikasi_pada ? '<div class="sub">' + waktu(p.diverifikasi_pada) + '</div>' : '') + '</td>' +
        '<td>' + (p.checkin_pada ? waktu(p.checkin_pada) : "—") + '</td>' +
        '<td><div class="aksi">' +
          (p.status !== "terverifikasi" ? btn(p.kode, "status", "terverifikasi", "Verifikasi", "filled") : "") +
          (p.status !== "batal" ? btn(p.kode, "status", "batal", "Batalkan", "line") : "") +
          (p.status === "batal" ? btn(p.kode, "status", "menunggu", "Aktifkan", "line") : "") +
          (p.status === "terverifikasi" ? btn(p.kode, "checkin", p.checkin_pada ? "batal" : "ya", p.checkin_pada ? "Batal check-in" : "Check-in", "line") : "") +
        '</div></td>' +
      '</tr>';
    }).join("");
  }

  function btn(kode, aksi, nilai, label, gaya) {
    return '<button class="btn btn--' + gaya + ' btn--sm" data-kode="' + esc(kode) + '" data-aksi="' + aksi + '" data-nilai="' + esc(nilai) + '">' + esc(label) + '</button>';
  }

  $("baris").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-aksi]");
    if (!b) return;
    var kode = b.dataset.kode, aksi = b.dataset.aksi, nilai = b.dataset.nilai;
    if (nilai === "batal" && aksi === "status" && !confirm("Batalkan pendaftaran " + kode + "?")) return;
    b.disabled = true;
    var jalur = aksi === "status" ? "/api/panitia/status" : "/api/panitia/checkin";
    var badan = aksi === "status" ? { kode: kode, status: nilai } : { kode: kode, batal: nilai === "batal" };
    minta(jalur, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(badan) })
      .then(function () { pesanOk(kode + " diperbarui."); return minta("/api/panitia/peserta").then(terima); })
      .catch(function (err) { b.disabled = false; pesanErr(err); });
  });

  ["cari", "filterStatus", "filterKategori"].forEach(function (id) {
    $(id).addEventListener("input", gambar);
  });

  var tersimpan = bacaToken();
  if (tersimpan) masuk(tersimpan).catch(function () { /* token kedaluwarsa: tampilkan gerbang */ });
})();
</script>
</body>
</html>
